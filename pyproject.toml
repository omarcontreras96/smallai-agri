[project]
name = "smallai-agri"
version = "0.1.0"
description = "SMS price-band assistant for smallholder maize and bean sellers in Uganda (Hack-Nation 7 x World Bank)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "lightgbm>=4.3",
  "rapidfuzz>=3.9",
  "africastalking>=1.2",
  "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "matplotlib>=3.9"]

[tool.pytest.ini_options]
testpaths = ["service/tests", "model/tests"]

# Public judge demo on Vercel: same app + /tmp SQLite + seeded demo offers + landing page
[tool.vercel]
entrypoint = "service.vercel_app:app"
